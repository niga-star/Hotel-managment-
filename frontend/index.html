<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Luxury Ethiopian Hotel Management & Booking PMS</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@500;700;800&family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
  <script src="https://cdn.tailwindcss.com"></script>
  <script>
    tailwind.config = {
      theme: {
        extend: {
          colors: {
            habesha: {
              green: '#0B4D34',
              greenDark: '#064E3B',
              greenLight: '#107550',
              gold: '#D4A329',
              goldDark: '#B8861B',
              goldLight: '#F3E5AB',
              ochre: '#C59B27',
              surface: '#F8FAFC'
            }
          },
          fontFamily: {
            sans: ['Inter', 'sans-serif'],
            serif: ['Cinzel', 'serif']
          }
        }
      }
    }
  </script>
  <style>
    /* Traditional Ethiopian Tibeb geometric background pattern */
    .tibeb-pattern {
      background-color: #0B4D34;
      background-image: radial-gradient(#D4A329 1.2px, transparent 1.2px), radial-gradient(#D4A329 1.2px, #0B4D34 1.2px);
      background-size: 24px 24px;
      background-position: 0 0, 12px 12px;
    }
    
    /* Custom scrollbar */
    ::-webkit-scrollbar {
      width: 6px;
      height: 6px;
    }
    ::-webkit-scrollbar-track {
      background: #f1f5f9;
    }
    ::-webkit-scrollbar-thumb {
      background: #cbd5e1;
      border-radius: 9999px;
    }
    ::-webkit-scrollbar-thumb:hover {
      background: #94a3b8;
    }
  </style>
</head>
<body class="bg-[#F4F6F8] text-slate-800 antialiased font-sans">
  <div id="app"></div>
  <script type="module" src="/src/main.js"></script>
</body>
</html>
